[package]
name = "rust-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
axum = "0.7"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
http = "0.2"
bytes = "1"
tokio-util = "0.7"
tower = "0.4"
async-trait = "0.1"

[dev-dependencies]
serde_json = "1.0"
